name: Quant Engine Hourly Paper Trader (H24 Cloud)

on:
  schedule:
    # Esegue ogni ora al minuto 0 (:00 UTC)
    - cron: '0 * * * *'
  workflow_dispatch: # Permette anche l'avvio manuale dal pulsante su GitHub

jobs:
  run-paper-trader:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy statsmodels yfinance PyYAML jinja2

      - name: Run Hourly Paper Trader Cycle
        run: |
          python quant_engine/run_hourly_paper_trader.py

      - name: Commit and Push Updated State and Dashboard
        run: |
          git config --global user.name "QuantEngine-Bot"
          git config --global user.email "bot@quantengine.local"
          git add quant_engine/state.json quant_engine/reports/paper_trades.csv quant_engine/reports/dashboard.html
          git commit -m "Auto-update paper trading state & dashboard [skip ci]" || echo "No changes to commit"
          git push
